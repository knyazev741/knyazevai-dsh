# Knyazev AI provider for DeepSeek Harness.
# Applied after dsh-base / dsh-web-app. Restates llm-pi-ai config so the
# route exists in the composition base; user settings still merge per provider
# and still own the API key. Do not retarget this row from another bundle.
- id: llm-pi-ai
  config:
    providers:
      knyazev-ai:
        displayName: Knyazev AI
        apiKeyEnv: KNYAZEV_AI_API_KEY
        api: openai-completions
        baseURL: https://knyazevai.work/v1
        # 20 retries on transient failures, applied to every model of this
        # provider. mode: always would retry until success (unbounded); normal
        # bounds it to transient codes with a hard cap of 20 attempts.
        retryPolicy:
          mode: normal
          maxRetries: 20
          retryableCodes:
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - EMPTY_RESPONSE
        compat:
          thinkingFormat: qwen
          supportsReasoningEffort: false
        reasoning: max
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 400000
            maxTokens: 40000
            reasoningEfforts:
              off: null
              high: high
              max: max
          - id: kimi-2.6
            name: Kimi 2.6
            contextWindow: 262144
            maxTokens: 40000
            reasoningEfforts:
              off: null
              high: high
              max: max
          - id: minimax-2.7
            name: MiniMax 2.7
            contextWindow: 204800
            maxTokens: 40000

# New sessions start on Knyazev Flash. Patch config replaces the whole row,
# so this is the composition default after install. A later picker choice
# still writes settings.yaml and wins over this layer.
- id: agent-default-model
  config:
    provider: knyazev-ai
    model: deepseek-v4-flash

# Spawned and forked children inherit the same route. Patch config replaces
# the whole row, so the bundle's original fields are restated here.
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    agentOptions:
      provider: knyazev-ai
      model: deepseek-v4-flash

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    agentOptions:
      provider: knyazev-ai
      model: deepseek-v4-flash

# Agent Presets mount compaction in a nested `compaction` group. The deployment
# plugin contributes a complete group replacement to standard, code, and
# cordis at preset-mount time, while minimal intentionally keeps no compaction.
- insert:
    - id: knyazev-ai-compaction
      name: '@knyazevai/dsh'
